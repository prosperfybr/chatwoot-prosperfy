name: Build and Deploy Chatwoot Prosperfy

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Permite executar manualmente

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: chatwoot-prosperfy

jobs:
  build:
    name: Build Custom Image
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Deploy') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push custom Chatwoot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfiles/custom.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-rails:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-rails:v4.8.0-custom
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-rails:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-rails:buildcache,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.event.head_commit.message, 'Deploy') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload docker-compose to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./docker-compose.production-prosperfy.yml"
          target: ${{ secrets.STACK_PATH }}
          strip_components: 1
          overwrite: true

      - name: Replace Docker Hub username in compose file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.STACK_PATH }}
            sed -i 's/SEU-USUARIO/${{ secrets.DOCKERHUB_USERNAME }}/g' docker-compose.production-prosperfy.yml

      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.STACK_PATH }}
            
            # Verificar se o arquivo existe
            if [ ! -f docker-compose.production-prosperfy.yml ]; then
              echo "❌ ERRO: docker-compose.production-prosperfy.yml não encontrado!"
              exit 1
            fi
            
            # Verificar se a rede existe
            if ! docker network ls | grep -q network_public; then
              echo "❌ ERRO: Rede network_public não encontrada!"
              exit 1
            fi
            
            # Fazer deploy
            echo "🚀 Iniciando deploy da stack chatwoot-prosperfy..."
            docker stack deploy -c docker-compose.production-prosperfy.yml chatwoot-prosperfy --with-registry-auth
            
            # Aguardar serviços iniciarem
            sleep 10
            
            # Verificar se os serviços foram criados
            echo "📋 Verificando serviços criados..."
            docker service ls | grep chatwoot-prosperfy || {
              echo "❌ ERRO: Nenhum serviço chatwoot-prosperfy foi criado!"
              echo "Logs do Docker:"
              docker stack ps chatwoot-prosperfy --no-trunc
              exit 1
            }
            
            echo "✅ Deploy concluído com sucesso!"
            docker service ls | grep chatwoot-prosperfy
